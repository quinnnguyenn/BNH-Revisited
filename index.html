<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="author" content="Quinn Nguyen">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bear Ninja Hunter</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">
    <h2>Bear, Ninja, Hunter</h2>
    <p>Play against the computer!</p>

    <ul class="rules">
      <li>The Bear beats the Hunter.</li>
      <li>The Hunter beats the Ninja.</li>
      <li>The Ninja beats the Bear.</li>
    </ul>

    <p>Click a button below to select your choice.</p>
    <hr class="divider">

    <div class="button-row">
      <button data-choice="Bear">Bear</button>
      <button data-choice="Ninja">Ninja</button>
      <button data-choice="Hunter">Hunter</button>
    </div>

    <hr class="divider">

    <div id="resultsBox" class="results-box" style="display: none;">
      <p id="results"></p>
    </div>

    <div id="scoreboard" class="scoreboard" style="display: none;">
      Your Wins: <span id="playerWins">0</span><br>
      Computer Wins: <span id="computerWins">0</span>
    </div>

    <hr class="divider">
    <button id="resetBtn">Play Again?</button>
    <hr class="divider">
  </div>

  <script src="script.js"></script>
</body>
</html>
